name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: local
  APP_URL: http://127.0.0.1:3000
  ION_REDIRECT_URI: http://127.0.0.1:3000/api/v1/auth/ion/callback
  DATABASE_URL: postgresql://opentj:opentj@127.0.0.1:5432/opentj?schema=public
  SESSION_SECRET: ci-only-session-secret-that-is-longer-than-32-characters
  DEMO_AUTH_ENABLED: "true"
  COURSE_JOIN_CODE: concrete-p4-demo
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_BUCKET: opentj-private
  S3_ACCESS_KEY: opentj
  S3_SECRET_KEY: ci-only-minio-secret
  S3_FORCE_PATH_STYLE: "true"
  CLAMAV_HOST: 127.0.0.1
  CLAMAV_PORT: "3310"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opentj
          POSTGRES_USER: opentj
          POSTGRES_PASSWORD: opentj
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opentj -d opentj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Build the deployable production image without runtime secrets
        run: docker build --target runner --tag opentj-production-check .
      - name: Check production packaging and environment-file exclusion
        run: |
          docker run --rm --entrypoint node opentj-production-check -e '
            const fs = require("node:fs");
            for (const path of ["server.js", ".next/static", "public", "node_modules/.prisma/client/schema.prisma"]) {
              if (!fs.existsSync(path)) throw new Error("Missing runtime path: " + path);
            }
            if (fs.readdirSync(".").some(name => name === ".env" || name.startsWith(".env."))) throw new Error("Environment file copied into runtime image");
            if (process.env.NODE_ENV !== "production") throw new Error("Runtime must use production mode");
            if (typeof require("@prisma/client").PrismaClient !== "function") throw new Error("Prisma runtime is unavailable");
          '
      - run: node scripts/check-env.mjs
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
      - run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Container and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build and start the complete stack
        run: docker compose up --detach --build

      - name: Wait for the web health contract
        env:
          HEALTH_TIMEOUT_MS: "600000"
        run: node scripts/wait-for-health.mjs

      - name: Run browser, responsive, security-header, and accessibility tests
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
        run: npm run test:e2e

      - name: Verify persistent API workflows
        run: npm run test:api

      - name: Verify private PDF lifecycle through MinIO and ClamAV
        run: npm run test:uploads

      - name: Capture container logs
        if: failure()
        run: docker compose logs --no-color > docker-compose.log

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            docker-compose.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans
